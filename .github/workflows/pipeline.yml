name: Incremental load

# Loads new data from the three sources into Neon every day.
# Each run resumes from the stored checkpoints, so a missed day is caught up
# automatically on the next run.

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC daily
  workflow_dispatch:       # manual run from the Actions tab

# Never let two loads write at the same time.
concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: python -m src.database.migrate

      - name: Run incremental pipeline
        run: python -m src.pipeline --mode incremental --trigger schedule

      - name: Keep pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 30
