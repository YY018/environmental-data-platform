# Pipeline settings. Non-secret values only; secrets live in .env / GitHub Secrets.

backfill:
  # Initial historical period (inclusive, UTC dates).
  # End date is 14 Nov: the Open-Meteo archive rejects end_date beyond yesterday
  # (verified 2026-11-15). Incremental ETL takes over from here.
  start_date: "2026-08-15"
  end_date: "2026-11-14"

paths:
  raw_data: data/raw
  processed_data: data/processed
  logs: logs

http:
  timeout_seconds: 30
  max_retries: 5
  backoff_min_seconds: 2
  backoff_max_seconds: 60

logging:
  level: INFO
  file: logs/pipeline.log
